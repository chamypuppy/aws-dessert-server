name: Backend EC2 Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. 빌드 단계 (Node.js)
      - name: Install dependencies & Build
        run: |
          npm install
          # npm run build (필요한 경우)
          
      # --- [보안 추가: SSH 문 열기] ---
      # A. [추가] 깃허브 IP 확인 (여기서부터 문 열기 시작!)
      - name: Get GitHub IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      # B. [추가] AWS 인증 (보안 그룹을 수정하기 위해 필요)
      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # C. [추가] 보안 그룹 22번 포트 열기
      - name: Add GitHub IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # ---------------------------------

      # 2. 서버로 파일 전송
      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}     # EC2 탄력적 IP
          username: ${{ secrets.EC2_USER }} # ubuntu나 리눅스 ec2-user
          key: ${{ secrets.EC2_KEY }}       # .pem 키 내용
          source: "**/*,!node_modules/**"   # 보낼 파일들
          target: "/home/ubuntu/aws-dessert-server"        # 서버 내 저장 위치


      # 3. 서버에서 실행
      - name: Execute remote commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/aws-dessert-server

            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "PORT=5000" >> .env
            echo "REACT_APP_CLIENT_URL=${{ secrets.REACT_APP_CLIENT_URL }}" >> .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env

            npm install --production
            pm2 delete all || true
            pm2 start server.js -- name "ubuntu-dessert-server"

      # --- [보안 추가: SSH 문 닫기] ---
      - name: Remove GitHub IP from Security Group
        if: always()                              # 배포가 성공하든 실패하든 무조건 실행해서 문을 닫아야 함!
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

